<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de Gestión de Almacén (SGA) - 100% Offline">
  <meta name="theme-color" content="#0066cc">
  <title>Sistema Kalulu - Gestión de Almacén</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  
  <!-- PWA Manifest (optional) -->
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <!-- Header -->
  <header>
    <div style="display:flex;align-items:center;min-width:0">
      <button id="nav-toggle-btn" class="nav-toggle-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="app-sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 style="display:flex;align-items:center;gap:9px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5l1.2-5.5h15.6l1.2 5.5"/><path d="M3 9.5a2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6.5h5V20"/></svg>Sistema Kalulu</h1>
    </div>
    <div class="header-user">
      <span id="user-name">Usuario</span>
      <span id="sync-badge" title="Firebase Sync" style="font-size:12px;cursor:default;user-select:none;">⚫</span>
      <button id="sync-now-btn" class="btn btn-outline btn-sm" title="Sincronizar ahora" style="min-width:70px;">⟳ Sync</button>
      <div class="backup-menu" id="backup-menu">
        <button class="btn btn-outline btn-sm" id="backup-btn" title="Backup de base de datos">💾</button>
        <div class="backup-dropdown" id="backup-dropdown">
          <button id="backup-export-btn">Exportar backup</button>
          <label id="backup-import-label">
            Restaurar backup
            <input type="file" id="backup-import-input" accept=".sqlite" style="display:none">
          </label>
        </div>
      </div>
      <button id="logout-btn" class="btn btn-outline btn-sm">Salir</button>
    </div>
  </header>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="app-sidebar">
    <nav>
      <ul>
        <!-- Navigation links will be populated by app.js -->
      </ul>
    </nav>
  </aside>

  <!-- Overlay del drawer mobile del sidebar (ver css/layout.css, .sidebar-overlay) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main Application Container -->
  <main id="app">
    <div class="alert alert-info">
      <strong>Cargando...</strong> Inicializando aplicación...
    </div>
  </main>

  <!-- Overlay de sincronización inicial (primer arranque en dispositivo nuevo) -->
  <div id="initial-sync-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;">
    <div style="width:40px;height:40px;border:4px solid #444;border-top-color:#0066cc;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <h2 style="font-size:1.2rem;margin:0">Descargando datos...</h2>
    <p id="initial-sync-progress" style="font-size:0.9rem;color:#aaa;max-width:320px;text-align:center">Conectando a Firebase...</p>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

  <!-- Core JavaScript Modules -->
  <!-- Firebase SDK (9 compat) -->
  <script src="./js/firebase-config.js?v=46"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-functions-compat.js"></script>

  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>

  <!-- SheetJS for Excel import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- html2canvas for image export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Application Scripts -->
  <script src="./js/utils.js?v=46"></script>
  <script src="./js/db.js?v=50"></script>
  <script src="./js/auth.js?v=46"></script>
  <script src="./js/sync.js?v=53"></script>
  <script src="./js/print.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/seed.js" type="module"></script>
  <script type="module">
    const v = Date.now();
    await import(`./js/app.js?v=${v}`);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>

  <!-- DevTools desbloqueado temporalmente para depuración -->
  <script>
    (function() {
      const btn = document.getElementById('sync-now-btn');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        if (!window.SGA_Sync?.isInitialized()) {
          btn.textContent = '❌ Sin conexión';
          setTimeout(() => { btn.textContent = '⟳ Sync'; }, 3000);
          return;
        }
        btn.disabled = true;
        btn.textContent = '⏳ Sync...';
        try {
          const pulled = await window.SGA_Sync.syncNow();
          // No recargar si hay una venta en curso (carrito sin confirmar): se perdería.
          if (pulled > 0 && !window.SGA_POS_ACTIVE_SALE) {
            btn.textContent = `✓ ${pulled} nuevo${pulled !== 1 ? 's' : ''}`;
            // Esperar a que lo recién sincronizado quede escrito en OPFS antes
            // de recargar — si no, la recarga puede cortar el guardado a mitad
            // de camino y esos datos se pierden (quedan solo en memoria).
            await window.SGA_DB.flush().catch(() => {});
            setTimeout(() => window.location.reload(), 400);
            return;
          }
          btn.textContent = '✓ Listo';
        } catch (err) {
          btn.textContent = '❌ Error';
        }
        setTimeout(() => { btn.textContent = '⟳ Sync'; btn.disabled = false; }, 3000);
      });
    })();
  </script>
</body>
</html>

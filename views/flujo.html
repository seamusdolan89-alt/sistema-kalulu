<!-- views/flujo.html — Flujo de Fondos -->
<style>
  .ff-table {
    border-collapse: collapse;
    font-size: 13px;
    width: 100%;
    background: #fff;
  }
  .ff-label-col {
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 3;
    min-width: 160px;
    max-width: 200px;
    padding: 6px 12px 6px 14px;
    border-right: 2px solid var(--color-border, #ddd);
    white-space: nowrap;
    text-align: left;
  }
  .ff-th {
    position: sticky;
    top: 0;
    background: var(--color-background, #f5f5f5);
    z-index: 2;
    padding: 6px 10px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 2px solid var(--color-border, #ddd);
    font-weight: 700;
    font-size: 12px;
    min-width: 100px;
  }
  .ff-th.ff-label-col { z-index: 4; }
  .ff-th-hoy {
    background: #fff9c4 !important;
    color: var(--color-primary, #0066cc);
  }
  .ff-dow { font-weight: 400; font-size: 11px; opacity: .75; }

  .ff-cell {
    padding: 5px 10px;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid #eee;
    min-width: 100px;
  }
  .ff-cell-saldo  { color: #1565c0; }
  .ff-cell-real   { background: #fff; }
  .ff-cell-est    { background: #fffde7; }
  .ff-cell-manual { background: #e8f5e9; }
  .ff-cell-blank  { background: #fafafa; }
  .ff-cell-total  { border-top: 1px solid #ccc; background: #fafafa; }
  .ff-negativo    { color: #c62828 !important; }
  .ff-alerta      { color: #e65100 !important; }

  .ff-row-header td { background: #f0f4f8; border-top: 2px solid #c5cae9; }
  .ff-row-final td  { background: #e8eaf6; border-top: 2px solid #9fa8da; }
  .ff-row-total td  { border-top: 1px solid #ccc; }
  .ff-row-prov:hover td { background: #f5f5f5 !important; }
  .ff-section-sep td {
    background: #eceff1;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #546e7a;
    padding: 8px 14px 4px;
    border-top: 2px solid #cfd8dc;
  }

  .ff-editable:hover { cursor: pointer; filter: brightness(.96); }
  .ff-editable input {
    width: 88px; text-align: right; font-size: 13px;
    padding: 3px 6px; border: 2px solid var(--color-primary, #0066cc);
    border-radius: 4px; background: #fff; display: block;
  }
  .ff-empty { color: #bbb; }
  .ff-val   { display: block; text-align: right; }
  .ff-dia-hab {
    display: block;
    font-size: 10px;
    color: var(--color-text-secondary, #888);
    font-weight: 400;
  }
  .ff-cell-liquidar { color: #2e7d32; }
</style>

<div class="page-header">
  <h2>📊 Flujo de Fondos</h2>
</div>
<div id="flujo-root" style="padding-bottom: 40px;"></div>

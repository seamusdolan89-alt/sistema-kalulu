<style>
  /* ── CUENTA CORRIENTE PROVEEDORES ────────────────────────────────────────── */
  #ccprov-root {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ── HEADER ──────────────────────────────────────────────────────────────── */
  .ccprov-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
    gap: 12px;
  }
  .ccprov-header-left { display: flex; align-items: center; gap: 12px; }
  .ccprov-back-btn {
    background: none;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    color: var(--color-text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .ccprov-back-btn:hover { background: var(--color-surface); color: var(--color-text); }
  .ccprov-header h2 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  .ccprov-header-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 1px; }
  .ccprov-header-right { display: flex; gap: 8px; }

  /* ── SALDO BADGE ─────────────────────────────────────────────────────────── */
  .saldo-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    vertical-align: middle;
  }
  .saldo-badge.deuda  { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
  .saldo-badge.saldado { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .saldo-badge.credito { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }

  /* ── FILTERS / SEARCH ────────────────────────────────────────────────────── */
  .ccprov-filters {
    display: flex;
    gap: 10px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
    align-items: center;
  }
  .ccprov-search {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    font-size: 14px;
    outline: none;
    background: var(--color-background);
    color: var(--color-text);
  }
  .ccprov-search:focus { border-color: var(--color-primary); }
  .ccprov-toggle {
    padding: 7px 14px;
    border: 1px solid var(--color-border);
    border-radius: 20px;
    background: var(--color-surface);
    cursor: pointer;
    font-size: 13px;
    color: var(--color-text-secondary);
    white-space: nowrap;
    transition: all 0.15s;
  }
  .ccprov-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .ccprov-toggle.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

  /* ── TABLE ───────────────────────────────────────────────────────────────── */
  .ccprov-table-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 20px;
  }
  .ccprov-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .ccprov-table thead th {
    padding: 10px;
    text-align: left;
    font-weight: 600;
    color: var(--color-text-secondary);
    border-bottom: 2px solid var(--color-border);
    white-space: nowrap;
    position: sticky;
    top: 0;
    background: var(--color-background);
    z-index: 1;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .ccprov-table thead th.right { text-align: right; }
  .ccprov-table tbody tr { border-bottom: 1px solid var(--color-border); transition: background 0.1s; }
  .ccprov-table tbody tr:hover { background: var(--color-surface); }
  .ccprov-table tbody td { padding: 10px; vertical-align: middle; }
  .ccprov-table tbody td.right { text-align: right; font-variant-numeric: tabular-nums; }
  .ccprov-table tfoot td {
    padding: 10px;
    font-weight: 700;
    border-top: 2px solid var(--color-border);
  }
  .ccprov-table tfoot td.right { text-align: right; }

  /* ── LEDGER SPECIFIC ─────────────────────────────────────────────────────── */
  .ledger-row-compra { }
  .ledger-row-pago td { color: var(--color-text-secondary); }
  .ledger-debe  { color: #c62828; font-weight: 600; }
  .ledger-haber { color: #2e7d32; font-weight: 600; }
  .ledger-saldo-deuda   { color: #e65100; font-weight: 700; }
  .ledger-saldo-saldado { color: #2e7d32; font-weight: 700; }
  .ledger-type-badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .ledger-type-compra { background: #fff3e0; color: #e65100; }
  .ledger-type-pago   { background: #e8f5e9; color: #2e7d32; }
  .ledger-type-gasto  { background: #ede7f6; color: #4527a0; }
  .ledger-type-nc     { background: #e3f2fd; color: #1565c0; }
  .ledger-btn-imputar {
    background: #1565c0; color: #fff; border: none; border-radius: 5px;
    padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .ledger-btn-imputar:hover { background: #0d47a1; }
  .ledger-btn-anular {
    background: #fff; color: #c62828; border: 1px solid #ef9a9a; border-radius: 5px;
    padding: 2px 9px; margin-left: 8px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .ledger-btn-anular:hover { background: #ffebee; border-color: #c62828; }
  .ccprov-anular-caja {
    margin-top: 12px; padding: 9px 12px; border-radius: 6px; font-size: 13px;
    background: #f5f7fa; border: 1px solid #e0e6ee; color: var(--color-text-secondary);
  }
  .ccprov-anular-caja.warn { background: #fff8e1; border-color: #ffcc80; color: #5d4037; }
  .ledger-imputar-box { background: #fff; border: 1px solid #bbdefb; border-radius: 6px; padding: 10px 12px; }
  .ledger-imputar-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
  .ledger-imputar-row + .ledger-imputar-row { border-top: 1px solid #f0f0f0; }
  .ledger-imputar-row .lir-ref { flex: 1; min-width: 0; }
  .ledger-imputar-row input { width: 120px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; text-align: right; }
  .ledger-saldo-parcial { color: #f57c00; font-size: 11px; font-weight: 600; }

  /* ── LEDGER AGRUPADO ─────────────────────────────────────────────────────── */
  .ledger-row-imp { }
  .ledger-row-imp td {
    background: #f9fafb;
    color: var(--color-text-secondary);
    border-bottom: 1px dashed #e8e8e8;
    font-size: 12px;
    padding-top: 7px;
    padding-bottom: 7px;
  }
  .ledger-row-imp:last-of-type td { border-bottom: 1px solid var(--color-border); }
  .ledger-imp-ref { display: flex; align-items: center; gap: 5px; padding-left: 14px; }
  .ledger-imp-ref::before { content: '└'; color: #bbb; font-size: 13px; line-height: 1; }
  .ledger-row-compra-saldada > td { opacity: 0.6; }
  .ledger-saldo-cero { color: #2e7d32; font-weight: 700; }
  .ledger-sin-pagos { font-size: 11px; color: #bbb; font-style: italic; padding-left: 14px; }

  /* Sección pagos sin imputar al final */
  .ledger-orphan-section { margin-top: 16px; }
  .ledger-orphan-title {
    font-size: 11px; font-weight: 700; color: #1565c0;
    text-transform: uppercase; letter-spacing: .05em;
    padding: 6px 0 4px; border-top: 2px solid #90caf9; margin-bottom: 0;
  }
  .ledger-row-orphan td { background: #e3f2fd; color: #1565c0; font-size: 12px; }

  /* Toggle bar */
  .ccprov-ledger-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 10px 20px 0;
    flex-shrink: 0;
  }
  .ccprov-ledger-bar-label { font-size: 12px; color: var(--color-text-secondary); }
  .ccprov-ledger-toggle { display: flex; gap: 0; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
  .ccprov-ledger-toggle button {
    padding: 5px 12px;
    border: none;
    background: var(--color-surface);
    color: var(--color-text-secondary);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .ccprov-ledger-toggle button + button { border-left: 1px solid var(--color-border); }
  .ccprov-ledger-toggle button.active { background: var(--color-primary); color: #fff; font-weight: 600; }

  /* ── SALDO SUMMARY CARD ──────────────────────────────────────────────────── */
  .ccprov-saldo-card {
    margin: 16px 20px 0;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    display: flex;
    gap: 32px;
    align-items: center;
    flex-shrink: 0;
  }
  .ccprov-saldo-item { display: flex; flex-direction: column; gap: 2px; }
  .ccprov-saldo-label { font-size: 11px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .ccprov-saldo-value { font-size: 1.4rem; font-weight: 700; }
  .ccprov-saldo-value.deuda   { color: #e65100; }
  .ccprov-saldo-value.saldado { color: #2e7d32; }
  .ccprov-saldo-value.credito { color: #1565c0; }

  /* ── ORPHAN CREDIT ALERT ─────────────────────────────────────────────────── */

  /* ── EMPTY STATE ─────────────────────────────────────────────────────────── */
  .ccprov-empty {
    text-align: center;
    color: var(--color-text-secondary);
    padding: 60px 20px;
    font-size: 14px;
  }
  .ccprov-empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

  /* ── BUTTONS ─────────────────────────────────────────────────────────────── */

  .ccprov-btn-icon {
    padding: 5px 9px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-background);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: background 0.1s;
  }
  .ccprov-btn-icon:hover { background: var(--color-surface); }
  .ccprov-btn-link {
    background: none;
    border: none;
    color: var(--color-primary);
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    text-decoration: underline;
  }

  /* ── MODAL ───────────────────────────────────────────────────────────────── */
  .ccprov-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: var(--z-modal);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .ccprov-overlay.hidden { display: none; }

  /* ── FORM FIELDS ─────────────────────────────────────────────────────────── */

  /* ── METODOS DE PAGO ─────────────────────────────────────────────────────── */

  .ccprov-metodo-disabled { opacity: .5; pointer-events: none; }

  /* ── TOTAL ───────────────────────────────────────────────────────────────── */

  /* ── IMPUTACION SECTION ──────────────────────────────────────────────────── */

  /* ── CREDIT SOBRANTE PREVIEW ─────────────────────────────────────────────── */

  /* ── ERROR MESSAGE ───────────────────────────────────────────────────────── */

  /* ── ACCIONES TABLE COLUMN ───────────────────────────────────────────────── */
  .ccprov-actions { display: flex; gap: 6px; align-items: center; }

  /* Botón remitos pendientes */
  .btn-remitos-prov { position: relative; }
  .ccprov-remito-badge {
    position: absolute; top: -4px; right: -4px;
    background: #e65100; color: white; border-radius: 8px;
    font-size: 9px; font-weight: 700; padding: 1px 4px; min-width: 14px; text-align: center;
    line-height: 1.4;
  }

  /* Modal remitos */
  .ccprov-remitos-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 900; display: flex; align-items: center; justify-content: center;
  }
  .ccprov-remitos-box {
    background: #fff; border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    width: 92%; max-width: 620px; max-height: 75vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ccprov-remitos-hdr {
    padding: 14px 20px; background: #1a2744; color: white;
    display: flex; align-items: center; justify-content: space-between;
  }
  .ccprov-remitos-hdr-title { font-size: 15px; font-weight: 700; }
  .ccprov-remitos-hdr-sub { font-size: 11px; color: rgba(255,255,255,0.65); margin-top: 2px; }
  .ccprov-remitos-close {
    background: none; border: none; color: rgba(255,255,255,0.8);
    font-size: 20px; cursor: pointer; line-height: 1;
  }
  .ccprov-remitos-close:hover { color: white; }
  .ccprov-remitos-body { overflow-y: auto; flex: 1; }
  .ccprov-remito-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid #eef0f4;
  }
  .ccprov-remito-row:hover { background: #f5f9ff; }
  .ccprov-remito-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .ccprov-remito-info strong { font-size: 14px; color: #1a2744; }
  .ccprov-remito-info span { font-size: 12px; color: #8090a0; }
  .ccprov-btn-vincular {
    background: #1565c0; color: white; border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    flex-shrink: 0;
  }
  .ccprov-btn-vincular:hover { background: #1976d2; }
  .ccprov-remitos-empty { padding: 28px 20px; text-align: center; color: #8090a0; font-size: 14px; }

  /* ── Tabs de sección ── */
  .prov-section-tabs {
    display: flex;
    padding: 0 20px;
    border-bottom: 2px solid var(--color-border);
    background: var(--color-background);
  }
  .prov-section-tab {
    padding: 10px 18px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .prov-section-tab:hover { color: var(--color-primary, #0066cc); }
  .prov-section-tab.active {
    color: var(--color-primary, #0066cc);
    border-bottom-color: var(--color-primary, #0066cc);
  }

  /* ── Mobile (<=768px) ─────────────────────────────────────────────────────
     Alcance: cargar pagos + consultar cuenta corriente (ambos alta
     prioridad, BACKLOG.md). El wizard de pago (ccprov-modal) ya funciona
     bien en el celular, no se toca. El extracto por defecto ya es
     "agrupado" (por factura) — es lo que el usuario prefirió del mockup —
     así que en mobile directamente se oculta el toggle a "Cronológico". */
  @media (max-width: 768px) {
    .ccprov-header { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
    .ccprov-header h2 { font-size: 1rem; }
    .ccprov-btn-primary { font-size: .78rem; padding: 7px 12px; white-space: nowrap; }
    .ccprov-filters { padding: 10px 14px; }

    /* Lista de proveedores -> cards */
    .ccprov-table-wrap { padding: 0 14px 14px; }
    #ccprov-table-wrap > .ccprov-table thead { display: none; }
    #ccprov-table-wrap > .ccprov-table,
    #ccprov-table-wrap > .ccprov-table tbody { display: block; width: 100%; }
    #ccprov-table-wrap > .ccprov-table tbody tr {
      display: block; position: relative; cursor: pointer;
      background: var(--color-background); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 12px 88px 44px 14px; margin-bottom: 10px;
    }
    #ccprov-table-wrap > .ccprov-table td { padding: 0; border: none; }
    #ccprov-table-wrap > .ccprov-table td:nth-child(1) { display: block; font-size: .95rem; font-weight: 700; color: var(--color-text); }
    #ccprov-table-wrap > .ccprov-table td:nth-child(2) { display: none; } /* contacto */
    #ccprov-table-wrap > .ccprov-table td:nth-child(3) { display: block; font-size: .74rem; color: var(--color-text-secondary); margin-top: 2px; }
    #ccprov-table-wrap > .ccprov-table td:nth-child(4) { position: absolute; top: 12px; right: 14px; text-align: right; }
    #ccprov-table-wrap > .ccprov-table td:nth-child(5) { position: absolute; bottom: 10px; left: 14px; right: 14px; }
    /* "Ver detalle" queda redundante (tocar la card ya abre el extracto);
       remitos pendientes se deja para la compu. */
    #ccprov-table-wrap .btn-ver-detalle,
    #ccprov-table-wrap .btn-remitos-prov { display: none; }
    #ccprov-table-wrap .btn-pagar {
      display: block; width: 100%; text-align: center; padding: 8px;
      border-radius: var(--radius-md); background: var(--color-primary); color: #fff;
      border: none; font-weight: 700; font-size: .78rem;
    }
    #ccprov-table-wrap .btn-pagar::after { content: " Pagar"; }

    /* Detalle — header, saldo, y se oculta el toggle (ya arranca en "agrupado") */
    .ccprov-saldo-card { margin: 12px 14px 0; padding: 12px 14px; gap: 8px; flex-wrap: nowrap; }
    .ccprov-saldo-item { flex: 1; text-align: center; min-width: 0; }
    .ccprov-saldo-value { font-size: 1.05rem; }
    .ccprov-credito-alert { margin: 12px 14px 0; }
    .ccprov-ledger-bar { display: none; }
    .ccprov-table-wrap#ccprov-table-wrap,
    div.ccprov-table-wrap { padding: 0 14px 14px; }

    /* Extracto agrupado (por factura) -> cards. Solo la tabla PRINCIPAL
       (hijo directo de ccprov-ledger-wrap) — no toca la tabla de la lista
       de arriba, que ya tiene su propio selector con #ccprov-table-wrap. */
    #ccprov-ledger-wrap > table.ccprov-table thead,
    .ledger-orphan-section table.ccprov-table thead { display: none; }
    #ccprov-ledger-wrap > table.ccprov-table,
    #ccprov-ledger-wrap > table.ccprov-table tbody,
    .ledger-orphan-section table.ccprov-table,
    .ledger-orphan-section table.ccprov-table tbody { display: block; width: 100%; }
    #ccprov-ledger-wrap > table.ccprov-table tfoot { display: none; } /* el saldo total ya está en la tarjeta de arriba */

    #ccprov-ledger-wrap tr,
    .ledger-orphan-section tr {
      display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px;
      padding: 9px 11px; border-radius: var(--radius-md); margin-bottom: 4px;
    }
    #ccprov-ledger-wrap td,
    .ledger-orphan-section td { padding: 0; border: none; text-align: left; }

    /* Fila de compra/gasto: card blanca con la referencia y el saldo de esa factura */
    #ccprov-ledger-wrap tr.ledger-row-compra {
      background: var(--color-background); border: 1px solid var(--color-border);
    }
    #ccprov-ledger-wrap tr.ledger-row-compra td:nth-child(1) { order: 1; font-size: .68rem; color: var(--color-text-secondary); }
    #ccprov-ledger-wrap tr.ledger-row-compra td:nth-child(2) { order: 2; }
    #ccprov-ledger-wrap tr.ledger-row-compra td:nth-child(3) { order: 3; flex: 1 0 100%; font-size: .84rem; font-weight: 700; color: var(--color-text); }
    #ccprov-ledger-wrap tr.ledger-row-compra td:nth-child(4) { order: 4; font-size: .78rem; }
    #ccprov-ledger-wrap tr.ledger-row-compra td:nth-child(5) { display: none; } /* haber: siempre "—" en esta fila */
    #ccprov-ledger-wrap tr.ledger-row-compra td:nth-child(6) { order: 5; margin-left: auto; font-size: .82rem; }

    /* Filas de pago imputado (o "sin pagos aplicados") anidadas: más chicas,
       tinte gris e indentadas — visualmente agrupadas bajo su factura sin
       depender de anidar HTML que hoy no existe (son <tr> hermanos). */
    #ccprov-ledger-wrap tr.ledger-row-imp {
      background: var(--color-surface); margin: -1px 0 4px 16px; padding: 6px 10px;
    }
    #ccprov-ledger-wrap tr.ledger-row-imp td:nth-child(1) { order: 1; font-size: .65rem; color: var(--color-text-light); }
    #ccprov-ledger-wrap tr.ledger-row-imp td:nth-child(2) { display: none; }
    #ccprov-ledger-wrap tr.ledger-row-imp td:nth-child(3) { order: 2; flex: 1; font-size: .72rem; }
    #ccprov-ledger-wrap tr.ledger-row-imp td:nth-child(3) .ledger-imp-ref { padding-left: 0; }
    #ccprov-ledger-wrap tr.ledger-row-imp td:nth-child(4),
    #ccprov-ledger-wrap tr.ledger-row-imp td:nth-child(6) { display: none; }
    #ccprov-ledger-wrap tr.ledger-row-imp td:nth-child(5) { order: 3; font-size: .74rem; }

    /* Pagos sin imputar — misma idea que un pago suelto, con el botón de
       Imputar bien visible (esto sí se usa desde el celular). */
    .ledger-orphan-section { margin: 14px 0 0; }
    .ledger-orphan-title { padding: 0 0 6px; }
    .ledger-orphan-section tr.ledger-row-orphan {
      background: var(--color-info-bg, #e3f2fd); flex-direction: column; align-items: flex-start;
    }
    .ledger-orphan-section tr.ledger-row-orphan td:nth-child(1) { font-size: .68rem; }
    .ledger-orphan-section tr.ledger-row-orphan td:nth-child(3) { font-size: .82rem; font-weight: 600; }
    .ledger-orphan-section tr.ledger-row-orphan td:nth-child(4) { display: none; }
    .ledger-orphan-section tr.ledger-row-orphan td:nth-child(5) { font-size: .8rem; font-weight: 700; }
    .ledger-orphan-section tr.ledger-row-orphan td:nth-child(6) { width: 100%; margin-top: 4px; }
    .ledger-orphan-section .ledger-btn-imputar { width: 100%; padding: 8px; }
  }
</style>

<div class="prov-section-tabs">

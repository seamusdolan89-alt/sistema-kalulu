<style>
  /* ── INFORMES MODULE ─────────────────────────────────────────────────────── */
  .inf-toolbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-background);
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .inf-title {
    margin: 0;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .inf-toolbar-controls {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 10px;
  }
  .inf-control-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .inf-control-group label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--color-text-secondary);
  }
  .inf-select, .inf-date {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 7px 10px;
    font-size: 13px;
    background: var(--color-background);
    color: var(--color-text);
    height: 34px;
    box-sizing: border-box;
  }
  .inf-select { min-width: 200px; }
  .inf-date   { width: 140px; }
  .inf-select:focus, .inf-date:focus {
    outline: 2px solid var(--color-primary);
    border-color: transparent;
  }
  .inf-quick-btns {
    display: flex;
    gap: 4px;
    align-self: flex-end;
  }

  /* ── RESULTS AREA ────────────────────────────────────────────────────────── */
  .inf-results-area { padding: 0 0 40px; }

  .inf-empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
    color: var(--color-text-secondary);
    text-align: center;
    gap: 12px;
  }
  .inf-empty-state .inf-empty-icon { font-size: 3rem; }
  .inf-empty-state p { font-size: 14px; margin: 0; }

  .inf-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 30vh;
    color: var(--color-text-secondary);
    font-size: 14px;
  }
  .inf-error {
    margin: 24px 20px;
    padding: 12px 16px;
    background: #fff3f3;
    border: 1px solid #fcc;
    border-radius: var(--radius-md);
    color: var(--color-danger);
    font-size: 13px;
  }
  .inf-empty {
    text-align: center;
    color: var(--color-text-secondary);
    font-size: 14px;
    padding: 32px 0;
  }

  /* ── REPORT HEADER ───────────────────────────────────────────────────────── */
  .inf-report-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--color-border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .inf-report-title h3 {
    margin: 0 0 2px;
    font-size: 1.1rem;
  }
  .inf-periodo {
    font-size: 12px;
    color: var(--color-text-secondary);
  }
  .inf-export-btns {
    display: flex;
    gap: 8px;
  }
  .inf-btn-excel {
    background: #1b7f3c;
    color: white;
    border-color: #1b7f3c;
  }
  .inf-btn-excel:hover { background: #145c2c; }

  /* ── KPI ROW ─────────────────────────────────────────────────────────────── */
  .inf-kpi-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  .inf-kpi {
    background: var(--color-background);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 12px 18px;
    min-width: 130px;
    flex: 1;
  }
  .inf-kpi.highlight {
    background: var(--color-primary-light);
    border-color: var(--color-primary);
  }
  .inf-kpi.danger {
    background: #fff3f3;
    border-color: #fcc;
  }
  .inf-kpi-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--color-text-secondary);
    margin-bottom: 4px;
  }
  .inf-kpi-value {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--color-text);
  }

  /* ── TABLE ───────────────────────────────────────────────────────────────── */
  .inf-table-wrap {
    overflow-x: auto;
    padding: 0 20px 20px;
  }
  .inf-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 700px;
  }
  .inf-table th {
    text-align: left;
    padding: 9px 12px;
    background: var(--color-surface);
    border-bottom: 2px solid var(--color-border);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--color-text-secondary);
    white-space: nowrap;
  }
  .inf-table th.num,
  .inf-table td.num { text-align: right; }
  .inf-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--color-border);
    color: var(--color-text);
  }
  .inf-table tbody tr:hover { background: var(--color-surface); }
  .inf-table tfoot td {
    padding: 10px 12px;
    border-top: 2px solid var(--color-border);
    border-bottom: none;
    font-weight: 700;
    background: var(--color-surface);
  }
  .inf-table td.mono { font-family: var(--font-family-mono); font-size: 12px; }
  .inf-table td.bold { font-weight: 600; }
  .inf-table tr.row-danger td { background: #fff5f5; }

  /* Compact table for analytics */
  .inf-table-compact { font-size: 12px; }
  .inf-table-compact th { padding: 6px 8px; }
  .inf-table-compact td { padding: 6px 8px; }

  /* ── TEXT HELPERS ─────────────────────────────────────────────────────────── */
  .text-success { color: var(--color-success); }
  .text-danger  { color: var(--color-danger); }
  .text-warning { color: #c98000; }
  .text-muted   { color: var(--color-text-secondary); }

  /* ── ANALYTICS GRID ──────────────────────────────────────────────────────── */
  .inf-analytics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
    gap: 0;
  }
  .inf-analytics-panel {
    padding: 20px 20px 24px;
    border-right: 1px solid var(--color-border);
    border-bottom: 1px solid var(--color-border);
  }
  .inf-analytics-panel:nth-child(even) { border-right: none; }
  .inf-analytics-panel h4 {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--color-text);
  }

  /* ── SECTION LABELS ──────────────────────────────────────────────────────── */
  .inf-section-label {
    padding: 8px 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--color-text-secondary);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    margin-top: 12px;
  }
  .inf-section-label.danger { color: var(--color-danger); background: #fff5f5; }

  /* ── PAYMENT TAGS ────────────────────────────────────────────────────────── */
  .inf-medio-tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    margin-right: 2px;
  }
  .mtag-efectivo          { background: #e8f5e9; color: #1b5e20; }
  .mtag-mercadopago       { background: #e3f2fd; color: #0d47a1; }
  .mtag-tarjeta           { background: #e1f5fe; color: #01579b; }
  .mtag-transferencia     { background: #f3e5f5; color: #6a1b9a; }
  .mtag-cuenta-corriente  { background: #fff3e0; color: #e65100; }
  .mtag-saldo-favor       { background: #f1f8e9; color: #33691e; }

  /* ── SUBSTITUTO BADGES ───────────────────────────────────────────────────── */
  .badge-si  { background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-no  { background: #ffebee; color: #c62828; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }

  /* ── EXTRA BAR ───────────────────────────────────────────────────────────── */
  .inf-extra-bar-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text);
  }
  .inf-extra-bar-inner label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--color-text-secondary);
  }

  /* ── AGING BADGES ────────────────────────────────────────────────────────── */
  .aging-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .aging-ok   { background: #e8f5e9; color: #2e7d32; }
  .aging-warn { background: #fff8e1; color: #f57f17; }
  .aging-high { background: #fff3e0; color: #e65100; }
  .aging-crit { background: #ffebee; color: #c62828; }

  /* ── NOTA PIE ────────────────────────────────────────────────────────────── */
  .inf-nota {
    font-size: 12px;
    color: var(--color-text-secondary);
    padding: 8px 20px 0;
    margin: 0;
    font-style: italic;
  }

  /* ── Admin-POS mobile: Ventas por Vendedor simplificado ──────────────────────
     Alcance definido con el usuario (BACKLOG.md): un solo reporte en mobile,
     sin selector de los otros 8 ni fechas sueltas — chips de período +
     "Elegir mes" (mes entero, no rango libre) + los KPIs y la lista de
     vendedores. Reusa queryVentasVendedor() tal cual (misma fórmula que el
     reporte de escritorio), solo cambia el render. */
  .inf-mobile-only { display: none; }
  @media (max-width: 768px) {
    body.admin-pos .inf-toolbar,
    body.admin-pos #inf-extra-bar,
    body.admin-pos #inf-results { display: none; }
    body.admin-pos .inf-mobile-only { display: block; padding: 14px 14px 12px; }
  }
  .inf-m-header h2 { margin: 0 0 10px; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
  .inf-m-periods { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .inf-m-chip {
    font-size: .74rem; font-weight: 700; padding: 6px 12px; border-radius: var(--radius-full);
    border: 1px solid var(--color-border-dark); background: var(--color-background); color: var(--color-text-secondary);
  }
  .inf-m-chip.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .inf-m-mes-input {
    display: none; width: 100%; margin-bottom: 12px; padding: 8px 10px;
    border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: .85rem;
    background: var(--color-background); color: var(--color-text);
  }
  .inf-m-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .inf-m-kpi {
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md);
    padding: 10px 12px;
  }
  .inf-m-kpi.inf-m-kpi-wide { grid-column: 1 / -1; background: var(--color-primary-light); border-color: var(--color-primary); }
  .inf-m-kpi .l { font-size: .62rem; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: .03em; }
  .inf-m-kpi .v { font-size: 1.05rem; font-weight: 700; color: var(--color-text); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .inf-m-kpi.inf-m-kpi-wide .v { color: var(--color-primary); }
  .inf-m-vendedores { display: flex; flex-direction: column; gap: 8px; }
  .inf-m-vend-card {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--color-background); border: 1px solid var(--color-border); border-radius: var(--radius-md);
    padding: 10px 12px;
  }
  .inf-m-vend-card .nombre { font-size: .84rem; font-weight: 600; color: var(--color-text); }
  .inf-m-vend-card .tx { font-size: .68rem; color: var(--color-text-light); margin-top: 1px; }
  .inf-m-vend-card .amt { text-align: right; }
  .inf-m-vend-card .neto { font-size: .86rem; font-weight: 700; color: var(--color-text); font-variant-numeric: tabular-nums; }
  .inf-m-vend-card .tick { font-size: .66rem; color: var(--color-text-light); margin-top: 1px; }
</style>

<div id="inf-root"></div>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema Kalulu - Login">
  <title>Sistema Kalulu - Inicia Sesión</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
    }

    .login-container {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--spacing-3xl);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-3xl);
    }

    .login-header h1 {
      font-size: var(--font-size-2xl);
      color: var(--color-primary);
      margin-bottom: var(--spacing-md);
    }

    .login-header p {
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    label {
      display: block;
      margin-bottom: var(--spacing-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text);
    }

    input {
      width: 100%;
      padding: var(--spacing-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      font-family: var(--font-family-base);
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-light);
    }

    .alert {
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-md);
      margin-bottom: var(--spacing-lg);
      border-left: 4px solid;
      color: #721c24;
      background-color: #f8d7da;
      border-color: var(--color-danger);
      display: none;
    }

    .alert.show {
      display: block;
    }

    .login-btn {
      width: 100%;
      padding: var(--spacing-md);
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-btn:hover {
      background-color: var(--color-primary-dark);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--color-text-secondary);
      margin-top: var(--spacing-md);
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: var(--spacing-sm);
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .dev-section {
      display: none;
      margin-top: var(--spacing-2xl);
      padding-top: var(--spacing-2xl);
      border-top: 1px solid var(--color-border);
      text-align: center;
    }

    .dev-section.show {
      display: block;
    }

    .dev-btn {
      padding: var(--spacing-sm) var(--spacing-lg);
      font-size: var(--font-size-sm);
      background-color: var(--color-secondary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      margin-top: var(--spacing-sm);
    }

    .dev-btn:hover {
      background-color: var(--color-secondary-dark);
    }

    .restore-section {
      margin-top: var(--spacing-xl);
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--color-border);
      text-align: center;
    }

    .restore-btn {
      background: none;
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: var(--radius-md);
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .restore-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: var(--color-primary-light);
    }

    #restore-status {
      margin-top: var(--spacing-sm);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      display: none;
    }

    /* Overlay de sincronización previa al login — solo Admin-POS en un
       dispositivo nuevo (ver script más abajo, "isAdminPos && isEmpty") */
    .sync-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      text-align: center;
      padding: var(--spacing-xl);
    }
    .sync-overlay.show {
      display: flex;
    }
    .sync-overlay p {
      font-size: var(--font-size-sm);
      color: #ddd;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <!-- Dispositivo nuevo entrando a Admin-POS: primero trae todo de Firestore
       (incluidos los usuarios reales) antes de dejar intentar el login — ver
       nota "isAdminPos" en el script de más abajo. -->
  <div id="sync-overlay" class="sync-overlay">
    <div class="spinner"></div>
    <h2 style="font-size:1.1rem;margin:0">Preparando Admin-POS...</h2>
    <p id="sync-progress">Conectando...</p>
  </div>

  <div class="login-container">
    <div class="login-header">
      <h1 style="display:flex;align-items:center;justify-content:center;gap:10px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5l1.2-5.5h15.6l1.2 5.5"/><path d="M3 9.5a2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6.5h5V20"/></svg>Sistema Kalulu</h1>
      <p>Gestión de Almacén</p>
    </div>

    <form id="login-form">
      <div id="error-alert" class="alert"></div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="nombre de usuario" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="login-btn" id="login-btn">Ingresar</button>
      
      <div class="loading" id="loading">
        <span class="spinner"></span>Verificando credenciales...
      </div>
    </form>

    <!-- Restaurar backup -->
    <div class="restore-section">
      <input type="file" id="restore-input" accept=".sqlite" style="display:none">
      <button type="button" class="restore-btn" id="restore-btn">💾 Restaurar backup</button>
      <div id="restore-status">Restaurando...</div>
    </div>

    <!-- Dev Section (only visible when dev_mode = true) -->
    <div class="dev-section" id="dev-section">
      <p style="font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--spacing-md);">
        ⚙️ Modo Desarrollo
      </p>
      <button type="button" id="seed-btn" class="dev-btn">Cargar Datos Demo</button>
    </div>
  </div>

  <!-- Firebase SDK (9 compat) — solo se usa para el pull inicial de Admin-POS
       en un dispositivo nuevo (ver script de más abajo). El login del POS
       (sin ?returnTo=admin-pos) sigue siendo 100% local, no toca esto. -->
  <script src="../js/firebase-config.js?v=46"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <!-- Core modules -->
  <script src="../js/utils.js?v=46"></script>
  <script src="../js/db.js?v=54"></script>
  <script src="../js/auth.js?v=46"></script>
  <script src="../js/sync.js?v=60"></script>

  <!-- Login script -->
  <script>
    (function() {
      'use strict';

      // URL de retorno (admin-pos pasa ?returnTo=../admin-pos/). Sin ese
      // param, el destino es el POS del local — arranca en el dashboard de
      // Inicio (ver js/app.js), no directo en #pos.
      const returnTo = new URLSearchParams(location.search).get('returnTo') || '../index.html#inicio';

      // ADMIN_MODE tiene que estar seteado ANTES de inicializar la DB: decide
      // qué archivo OPFS abre js/db.js (sga-admin.db vs sga.db, ver ~línea 74
      // ahí). Antes de este fix, login.html siempre abría sga.db sin importar
      // el destino — en un dispositivo que nunca entró a admin-pos, el chequeo
      // de contraseña corría contra una base vacía/equivocada y nadie podía
      // loguearse con su contraseña real (solo con el admin por defecto que
      // crea db.js en la primera instalación, ver "Primera vez" ahí).
      const isAdminPos = returnTo.includes('admin-pos');
      if (isAdminPos) window.ADMIN_MODE = true;

      const errorAlert = document.getElementById('error-alert');
      const loginBtn   = document.getElementById('login-btn');
      const loading    = document.getElementById('loading');

      // Todo el trabajo async (init de DB/auth + el pre-sync de admin-pos)
      // vive en esta promesa, y el <form> engancha su listener de submit
      // ANTES de arrancarla (más abajo) — a propósito: si el listener se
      // engancha recién después de awaitear esto (como estaba antes), un
      // click en "Ingresar" mientras el pre-sync todavía está en curso (el
      // overlay tapando la pantalla puede durar varios segundos reales
      // contra Firestore) no encuentra ningún handler todavía, y el <form>
      // hace un submit NATIVO (recarga la página) — interrumpe la sync a
      // mitad de camino y deja la DB local en un estado inconsistente. Con
      // el listener ya enganchado desde el vamos, cualquier click llama
      // siempre a preventDefault() primero, y recién después espera esta
      // promesa antes de chequear la contraseña.
      const ready = (async () => {
        try {
          await window.SGA_DB.initialize();
        } catch (error) {
          errorAlert.textContent = 'Error al inicializar la base de datos: ' + error.message;
          errorAlert.classList.add('show');
          throw error;
        }

        // Inicializar auth (solo restaura sesión si ya existía)
        await window.SGA_Auth.initialize();

        // Si ya hay sesión activa, redirigir directamente
        if (window.SGA_Auth.isAuthenticated()) {
          window.location.href = returnTo;
          return;
        }

        // Admin-POS en un dispositivo nuevo: la base local recién abierta
        // solo tiene el admin por defecto (admin/kalulu123) — sin esto no
        // hay forma de entrar con la contraseña real. Si se ve vacía
        // (`productos` en 0, proxy de "nunca sincronizó nada"), traer SOLO
        // usuarios antes de dejar intentar el login — no las ~28
        // colecciones completas (initialSyncFromFirestore), que en una base
        // real con meses de ventas/compras podía tardar minutos en una
        // conexión de celular antes de mostrar siquiera el formulario. El
        // resto de los datos sigue llegando igual que siempre, pero DESPUÉS
        // de loguearse, con su propio overlay en admin-pos/index.html. Si
        // esto falla (sin internet, o bloqueado como en los tests e2e) se
        // sigue de largo con los datos locales.
        if (isAdminPos) {
          const overlay = document.getElementById('sync-overlay');
          try {
            const productCount = window.SGA_DB.query('SELECT COUNT(*) as n FROM productos');
            const isEmpty = !productCount || productCount[0]?.n === 0;
            if (isEmpty && window.SGA_Sync?.pullUsuariosOnly) {
              const progressEl = document.getElementById('sync-progress');
              overlay.classList.add('show');
              loginBtn.disabled = true;
              await window.SGA_Sync.pullUsuariosOnly((msg) => {
                if (progressEl) progressEl.textContent = msg;
              });
            }
          } catch (err) {
            console.warn('Sync inicial previa al login falló (se sigue con los datos locales):', err.message);
          } finally {
            overlay.classList.remove('show');
            loginBtn.disabled = false;
          }
        }

        // Mostrar sección dev si corresponde
        if (localStorage.getItem('dev_mode') === 'true') {
          document.getElementById('dev-section').classList.add('show');
        }
      })();

      // Submit del formulario
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        loginBtn.disabled = true;
        loading.classList.add('show');
        errorAlert.classList.remove('show');

        try {
          await ready; // DB/auth listas y, si corresponde, el pre-sync de admin-pos ya terminó
        } catch (_) {
          // El error de inicialización de la DB ya se muestra arriba
          loading.classList.remove('show');
          return;
        }

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
          await window.SGA_Auth.login(username, password);
          window.location.href = returnTo;
        } catch (error) {
          errorAlert.textContent = error.message || 'Error al iniciar sesión';
          errorAlert.classList.add('show');
          loginBtn.disabled = false;
          loading.classList.remove('show');
        }
      });

      // Restaurar backup
      document.getElementById('restore-btn').addEventListener('click', () => {
        document.getElementById('restore-input').click();
      });

      document.getElementById('restore-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!confirm(`¿Restaurar la base de datos desde "${file.name}"?\n\nSe reemplazarán todos los datos actuales.`)) {
          e.target.value = '';
          return;
        }
        const statusEl = document.getElementById('restore-status');
        const restoreBtn = document.getElementById('restore-btn');
        try {
          statusEl.style.display = 'block';
          restoreBtn.disabled = true;
          await ready.catch(() => {});
          await window.SGA_DB.importarBackup(file);
          alert('Backup restaurado correctamente. La página se va a recargar.');
          location.reload();
        } catch (err) {
          alert('Error al restaurar: ' + err.message);
          statusEl.style.display = 'none';
          restoreBtn.disabled = false;
        }
        e.target.value = '';
      });

      // Botón seed (modo dev) — solo se ve tras ready() (dev-section), así
      // que para cuando es clickeable la DB ya está lista.
      document.getElementById('seed-btn')?.addEventListener('click', async () => {
        const seedBtn = document.getElementById('seed-btn');
        try {
          seedBtn.disabled = true;
          seedBtn.textContent = 'Cargando datos...';
          await import('../js/seed.js').then(m => m.default());
          // Esperar a que el seed quede escrito en OPFS antes de navegar —
          // si no, la navegación dura de abajo puede cortar el guardado a
          // mitad de camino y los datos demo se pierden (quedan solo en
          // memoria de esta página, que está por destruirse).
          await window.SGA_DB.flush().catch(() => {});
          // En dev mode, login automático (db.js crea admin/kalulu123 en la primera instalación)
          await window.SGA_Auth.login('admin', 'kalulu123');
          window.location.href = returnTo;
        } catch (error) {
          alert('Error: ' + error.message);
          seedBtn.disabled = false;
          seedBtn.textContent = 'Cargar Datos Demo';
        }
      });
    })();
  </script>
</body>
</html>

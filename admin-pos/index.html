<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema Kalulu - Panel de Administración">
  <meta name="theme-color" content="#1a5c2e">
  <title>Sistema Kalulu - Administración</title>

  <!-- CSS (mismos que el POS, un nivel arriba) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    /* ── Header verde para distinguir admin del POS ── */
    header {
      background-color: #1a5c2e;
    }

    /* ── Overlay de sincronización inicial ── */
    #initial-sync-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #fff;
    }
    #initial-sync-overlay h2 { font-size: 1.2rem; margin: 0; }
    #initial-sync-progress {
      font-size: 0.9rem;
      color: #aaa;
      max-width: 320px;
      text-align: center;
    }
    .sync-spinner {
      width: 40px; height: 40px;
      border: 4px solid #444;
      border-top-color: #0066cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Overlay de carga inicial desde Firestore -->
  <div id="initial-sync-overlay">
    <div class="sync-spinner"></div>
    <h2>Descargando datos...</h2>
    <p id="initial-sync-progress">Conectando a Firebase...</p>
  </div>

  <!-- Header (idéntico al POS) -->
  <header>
    <div style="display:flex;align-items:center;min-width:0">
      <button id="nav-toggle-btn" class="nav-toggle-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="app-sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 style="display:flex;align-items:center;gap:9px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5l1.2-5.5h15.6l1.2 5.5"/><path d="M3 9.5a2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0 2.2 2.2 0 0 0 4.4 0"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6.5h5V20"/></svg>Kalulu Admin</h1>
    </div>
    <div class="header-user">
      <span id="user-name">Usuario</span>
      <span id="sync-badge" title="Firebase Sync" style="font-size:12px;cursor:default;user-select:none;">⚫</span>
      <button id="sync-btn" class="btn btn-sm" title="Traer y enviar cambios con el local (también automático cada 5 min)" style="background:#1a4a7a;border:1px solid #64b5f6;color:#fff;font-weight:600;min-width:90px;">⬇⬆<span class="btn-label"> Sincronizar</span></button>
      <div class="backup-menu" id="backup-menu">
        <button class="btn btn-outline btn-sm" id="backup-btn" title="Backup de base de datos">💾</button>
        <div class="backup-dropdown" id="backup-dropdown">
          <button id="backup-export-btn">Exportar backup</button>
          <label id="backup-import-label">
            Restaurar backup
            <input type="file" id="backup-import-input" accept=".sqlite" style="display:none">
          </label>
        </div>
      </div>
      <button id="logout-btn" class="btn btn-outline btn-sm">Salir</button>
    </div>
  </header>

  <!-- Sidebar (llenado por app.js, igual que en el POS) -->
  <aside class="sidebar" id="app-sidebar">
    <nav>
      <ul>
        <!-- Navegación generada por app.js con NAV_BY_ROLE[admin_pos] -->
      </ul>
    </nav>
  </aside>

  <!-- Overlay del drawer mobile del sidebar (ver css/layout.css, .sidebar-overlay) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Barra inferior de navegación — solo mobile (ver css/layout.css,
       body.admin-pos .admin-tabbar). Reemplaza al sidebar/hamburguesa acá:
       son los 5 accesos que se consultan desde el celular (BACKLOG.md,
       "Admin-POS responsive"), no los 22 módulos de escritorio. app.js le
       marca la tab activa en cada navegación (.tab.active). -->
  <nav class="admin-tabbar" id="admin-tabbar" aria-label="Navegación principal">
    <a href="#inicio" class="tab" data-tab="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M4 10a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></svg>
      <span>Inicio</span>
    </a>
    <a href="#productos" class="tab" data-tab="productos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5L12 12l8-4.5"/><path d="M12 12v9"/></svg>
      <span>Productos</span>
    </a>
    <a href="#ordenes" class="tab" data-tab="ordenes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>
      <span>Órdenes</span>
    </a>
    <a href="#cuenta_corriente_proveedores" class="tab" data-tab="cuenta_corriente_proveedores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/><path d="M10 21v-4h4v4"/></svg>
      <span>Proveedores</span>
    </a>
    <a href="#informes" class="tab" data-tab="informes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20V12M12 20V6M18 20V14"/><path d="M3 20h18"/></svg>
      <span>Informes</span>
    </a>
  </nav>

  <!-- Contenido principal -->
  <main id="app">
    <div class="alert alert-info">
      <strong>Cargando...</strong> Inicializando panel de administración...
    </div>
  </main>

  <!-- Firebase SDK (9 compat) -->
  <script src="../js/firebase-config.js?v=46"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

  <!-- Tesseract.js para OCR (facturas de compra) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>

  <!-- SheetJS para exportar a Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Módulos del sistema (mismo código que el POS) -->
  <script src="../js/utils.js?v=46"></script>
  <script src="../js/db.js?v=54"></script>
  <script src="../js/auth.js?v=46"></script>
  <script src="../js/sync.js?v=60"></script>
  <script src="../js/print.js"></script>
  <script src="../js/icons.js"></script>

  <script type="module">
    // Flags que app.js lee para saber que está en modo administrador
    window.ADMIN_MODE = true;
    window.VIEWS_BASE_PATH = '../views/';

    const v = Date.now();
    await import(`../js/app.js?v=${v}`);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
  <script>
    (function() {
      // Un solo botón: trae (pull) y manda (push a POS) en la misma acción —
      // window.SGA_Sync.syncNow() ya hace las dos cosas en modo admin (ver
      // js/sync.js). Antes eran dos botones separados y manuales; el cambio
      // hecho acá podía quedar horas sin subir si nadie apretaba "Push POS",
      // ampliando la ventana en la que un pull entrante lo pisaba y se
      // perdía. Esta misma acción también corre sola cada 5 min de fondo
      // (sin recargar la pantalla) — el botón es para forzarla ya.
      const btn = document.getElementById('sync-btn');
      if (!btn) return;
      const RESET_HTML = '⬇⬆<span class="btn-label"> Sincronizar</span>';

      btn.addEventListener('click', async () => {
        if (!window.SGA_Sync?.isInitialized()) {
          btn.textContent = '❌ Sin conexión';
          setTimeout(() => { btn.innerHTML = RESET_HTML; }, 3000);
          return;
        }
        btn.disabled = true;
        btn.textContent = '⏳ Sincronizando...';
        try {
          const pulled = await window.SGA_Sync.syncNow();
          if (pulled > 0) {
            // Las vistas cargan su propio state al abrirse y no escuchan cambios
            // en la base local — sin este reload, lo recién traído no se ve
            // hasta que el usuario navega o refresca manualmente.
            btn.textContent = `✓ ${pulled} nuevo${pulled !== 1 ? 's' : ''}`;
            // Esperar a que lo recién sincronizado quede escrito en OPFS antes
            // de recargar — si no, la recarga puede cortar el guardado a mitad
            // de camino y esos datos se pierden (quedan solo en memoria).
            await window.SGA_DB.flush().catch(() => {});
            setTimeout(() => window.location.reload(), 400);
            return;
          }
          btn.textContent = '✓ Al día';
        } catch (err) {
          console.error('Sync error:', err.message);
          btn.textContent = '❌ Error';
        }
        setTimeout(() => { btn.innerHTML = RESET_HTML; btn.disabled = false; }, 3000);
      });
    })();
  </script>

</body>
</html>
